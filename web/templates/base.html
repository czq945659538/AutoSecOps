<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AutoSecOps{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <div class="nav-brand">
    <span class="brand-icon">🛡️</span>
    <span class="brand-text">AutoSecOps</span>
  </div>
  <ul class="nav-links">
    <li><a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">仪表盘</a></li>
    <li><a href="{{ url_for('scan_page') }}" class="{{ 'active' if request.endpoint == 'scan_page' else '' }}">发起扫描</a></li>
    <li><a href="{{ url_for('history_page') }}" class="{{ 'active' if request.endpoint == 'history_page' else '' }}">扫描历史</a></li>
  </ul>
  <div class="nav-right">
    <span class="version-tag">v0.1.0</span>
  </div>
</nav>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>AutoSecOps — 自动化运维与代码安全平台 &copy; 2025</p>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
