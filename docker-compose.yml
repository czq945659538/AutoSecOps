# AutoSecOps — Docker Compose
# Web UI + Redis (for async scan workers)

services:
  web:
    image: python:3.11-slim
    container_name: autosecops-web
    working_dir: /app
    volumes:
      - .:/app
      - ./autoops-reports:/app/autoops-reports
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-me-in-production
      - REDIS_URL=redis://redis:6379/0
      - PORT=8080
    depends_on:
      - redis
    command: >
      bash -c "pip install -r requirements.txt --quiet
      && python -m autoops.web.app"

  redis:
    image: redis:7-alpine
    container_name: autosecops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
