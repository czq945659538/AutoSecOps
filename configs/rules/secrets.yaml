# AutoSecOps — Secret Detection Rules (YAML extension)
# These are merged with built-in rules in autoops/scanner/secret.py

rules:
  - id: SEC023
    type: Aliyun Access Key
    severity: critical
    title: Aliyun (Alibaba Cloud) Access Key
    pattern: '(LTAI[L:a-zA-Z0-9]{20,})|(aliyun[A-Za-z0-9/+=]{20,})'
    message: |
      Aliyun access key detected. Rotate immediately in the Aliyun RAM console.
    reference: https://help.aliyun.com/document_detail/116868.html

  - id: SEC024
    type: Tencent Cloud Secret
    severity: critical
    title: Tencent Cloud Secret Key
    pattern: '(AKID[A-Za-z0-9]{32,})|(tencent[A-Za-z0-9/+=]{32,})'
    message: |
      Tencent Cloud secret detected. Revoke in the CAM console.
    reference: https://cloud.tencent.com/document/product/598

  - id: SEC025
    type: RSA Private Key
    severity: critical
    title: RSA Private Key in source
    pattern: '-----BEGIN RSA PRIVATE KEY-----'
    message: |
      RSA private key found in source code. Remove immediately and rotate the key.
    reference: https://security.stackexchange.com/

  - id: SEC026
    type: Azure Key Vault
    severity: critical
    title: Azure Key Vault Connection String
    pattern: '(DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[^;]+)'
    message: |
      Azure storage account key detected. Rotate in Azure Portal.
    reference: https://docs.microsoft.com/en-us/azure/storage/common/storage-account-keys-manage
